version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: legaldocs_db_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=legaldocs_db
      - POSTGRES_USER=legaldocs_user
      - POSTGRES_PASSWORD=devpassword123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legaldocs_user -d legaldocs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: legaldocs_redis_dev
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: legaldocs_web_dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-dev-key-change-in-production-abc123xyz
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DB_NAME=legaldocs_db
      - DB_USER=legaldocs_user
      - DB_PASSWORD=devpassword123
      - DB_HOST=db
      - DB_PORT=5432
      - CONN_MAX_AGE=0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/1
      - LOAD_DEMO_DATA=true
      - DISABLE_THROTTLING=1
      - USE_S3=${USE_S3:-False}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadminsecure}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-legaldocs-media}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-http://localhost:9000}
      - AWS_S3_ENDPOINT_URL_INTERNAL=http://minio:9000
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  minio:
    image: minio/minio
    container_name: legaldocs_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadminsecure
    command: server /data --console-address ":9001"

  minio-create-bucket:
    image: minio/mc
    container_name: legaldocs_minio_setup_dev
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminsecure) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb myminio/legaldocs-media || true;
      /usr/bin/mc anonymous set private myminio/legaldocs-media;
      exit 0;
      "

volumes:
  postgres_data_dev:
  minio_data_dev:

