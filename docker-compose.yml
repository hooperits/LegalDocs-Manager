version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: legaldocs_db_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=legaldocs_db
      - POSTGRES_USER=legaldocs_user
      - POSTGRES_PASSWORD=devpassword123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legaldocs_user -d legaldocs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: legaldocs_web_dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-dev-key-change-in-production-abc123xyz
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DB_NAME=legaldocs_db
      - DB_USER=legaldocs_user
      - DB_PASSWORD=devpassword123
      - DB_HOST=db
      - DB_PORT=5432
      - LOAD_DEMO_DATA=true
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_dev:
