version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: legaldocs_db_prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=legaldocs_prod
      - POSTGRES_USER=legaldocs_user
      - POSTGRES_PASSWORD=prodpasswordsecure123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legaldocs_user -d legaldocs_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: legaldocs_redis_prod
    expose:
      - "6379"

  web:
    build: .
    container_name: legaldocs_web_prod
    environment:
      - DEBUG=False
      - SECRET_KEY=django-secure-prod-key-please-change-this-in-actual-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DB_NAME=legaldocs_prod
      - DB_USER=legaldocs_user
      - DB_PASSWORD=prodpasswordsecure123
      - DB_HOST=db
      - DB_PORT=5432
      - CONN_MAX_AGE=60
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/1
      - STATIC_ROOT=/app/legaldocs/staticfiles
      - MEDIA_ROOT=/app/legaldocs/media
      - LOAD_DEMO_DATA=false
    volumes:
      - django_static:/app/legaldocs/staticfiles
      - django_media:/app/legaldocs/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.25-alpine
    container_name: legaldocs_nginx_prod
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/var/www/legaldocs/static:ro
      - django_media:/var/www/legaldocs/media:ro
    depends_on:
      - web

volumes:
  postgres_data_prod:
  django_static:
  django_media:
